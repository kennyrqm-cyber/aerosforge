name: AeroComm Source Bootstrap

on:
  push:
    branches:
      - feature/aerocomm-master-v104-preview
    paths:
      - .aerocomm-bootstrap/part00.b64
      - .github/workflows/aerocomm-source-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified RC archive
        run: |
          base64 -d .aerocomm-bootstrap/part00.b64 > /tmp/aerocomm-v1.0.4.zip
          echo "5331d30f837cbf52d2d006fe1c6a7df0ce3f10d6f4aa54f77edd36c41b09d2ac  /tmp/aerocomm-v1.0.4.zip" | sha256sum -c -
          rm -rf /tmp/aerocomm-src
          mkdir -p /tmp/aerocomm-src
          unzip -q /tmp/aerocomm-v1.0.4.zip -d /tmp/aerocomm-src
      - name: Replace application source with RC
        run: |
          SRC=/tmp/aerocomm-src/aerocomm-master-mvp-v1.0.4
          rm -rf app components lib supabase scripts tests docs
          cp -a "$SRC/app" .
          cp -a "$SRC/components" .
          cp -a "$SRC/lib" .
          cp -a "$SRC/supabase" .
          cp -a "$SRC/scripts" .
          cp -a "$SRC/tests" .
          cp -a "$SRC/docs" .
          cp "$SRC/middleware.ts" "$SRC/next-env.d.ts" "$SRC/next.config.mjs" "$SRC/package.json" "$SRC/tsconfig.json" "$SRC/tsconfig.core.json" "$SRC/tsconfig.engine-test.json" "$SRC/vercel.json" "$SRC/deployment-manifest.json" "$SRC/release-provenance.json" "$SRC/README.md" .
          cp "$SRC/.npmrc" "$SRC/.nvmrc" "$SRC/.vercelignore" "$SRC/.env.example" .
      - name: Commit full RC source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib supabase scripts tests docs middleware.ts next-env.d.ts next.config.mjs package.json package-lock.json tsconfig.json tsconfig.core.json tsconfig.engine-test.json vercel.json deployment-manifest.json release-provenance.json README.md .npmrc .nvmrc .vercelignore .env.example
          if git diff --cached --quiet; then
            echo "RC source already materialized"
            exit 0
          fi
          git commit -m "feat(aerocomm): materialize v1.0.4 RC source"
          git push
