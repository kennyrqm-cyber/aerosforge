name: AeroComm v1.0.4 Build Gate

on:
  push:
    branches:
      - feature/aerocomm-master-v104-preview
    paths:
      - .github/workflows/aerocomm-v104-build-gate.yml
      - package.json
      - package-lock.json
      - app/**
      - components/**
      - lib/**
      - scripts/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify canonical RC identity
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='aerocomm-master-mvp'||p.version!=='1.0.4') process.exit(1)"
          test -f package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Release verification
        run: npm run verify:release
      - name: Full TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
