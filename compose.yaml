services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerosforge
      POSTGRES_PASSWORD: aerosforge_local_only
      POSTGRES_DB: aerosforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerosforge -d aerosforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - aerosforge_postgres:/var/lib/postgresql/data
volumes:
  aerosforge_postgres:
